<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8C97A"/>
      <stop offset="75%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1200" height="340" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="#0B0B0B"/>

  <!-- Grid -->
  <rect width="1200" height="340" fill="url(#grid)" clip-path="url(#rounded)"/>

  <!-- Glow overlays -->
  <rect width="1200" height="340" fill="url(#glowCenter)" clip-path="url(#rounded)"/>
  <circle cx="0" cy="0" r="360" fill="url(#glowLeft)" clip-path="url(#rounded)"/>

  <!-- Top gold bar -->
  <rect width="1200" height="3" fill="url(#topBar)"/>

  <!-- Logo box -->
  <rect x="64" y="64" width="52" height="52" rx="12" fill="white"/>
  <text x="90" y="99" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#0B0B0B">B</text>

  <!-- Wordmark -->
  <text x="132" y="87" font-family="'Arial', sans-serif" font-size="11" font-weight="700" fill="#C9A84C" letter-spacing="3">BITHOUR PRODUCTION</text>
  <text x="132" y="106" font-family="'Arial', sans-serif" font-size="10" fill="#F2EFE8" opacity="0.3" letter-spacing="2">INTERNAL PORTAL SYSTEM</text>

  <!-- Main headline -->
  <text x="64" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="900" fill="#F2EFE8" opacity="0.95" letter-spacing="-2">CREATOR</text>
  <text x="64" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="900" fill="none" stroke="#C9A84C" stroke-width="2" letter-spacing="-2">PIPELINE</text>

  <!-- Tags -->
  <rect x="64" y="300" width="160" height="26" rx="13" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <text x="144" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#F2EFE8" opacity="0.5">Document Management</text>

  <rect x="234" y="300" width="110" height="26" rx="13" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <text x="289" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#F2EFE8" opacity="0.5">Invoice &amp; MoU</text>

  <rect x="354" y="300" width="96" height="26" rx="13" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <text x="402" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#F2EFE8" opacity="0.5">Video Review</text>

  <rect x="460" y="300" width="80" height="26" rx="13" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <text x="500" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#F2EFE8" opacity="0.5">Analytics</text>

  <!-- Right side: tech stack vertical -->
  <text x="1136" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#C9A84C" opacity="0.5" letter-spacing="1">STACK</text>
  <line x1="1136" y1="100" x2="1136" y2="106" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1136" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">Next.js 16</text>
  <text x="1136" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">Prisma ORM</text>
  <text x="1136" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">PostgreSQL</text>
  <text x="1136" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">BullMQ</text>
  <text x="1136" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">Redis</text>
  <text x="1136" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">Tigris S3</text>
  <text x="1136" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F2EFE8" opacity="0.35">Gemini AI</text>

  <!-- Vertical accent line -->
  <line x1="1080" y1="64" x2="1080" y2="276" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.12"/>

  <!-- URL bottom right -->
  <text x="1136" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#C9A84C" opacity="0.4" letter-spacing="1">fly.dev</text>

  <!-- Bottom border -->
  <rect x="0" y="337" width="1200" height="3" rx="0" fill="url(#topBar)" opacity="0.4"/>
</svg>
