app = 'bithour-production'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node node_modules/prisma/build/index.js db push'

[env]
  PORT            = '3000'
  NODE_ENV        = 'production'
  NEXT_TELEMETRY_DISABLED = '1'
  NEXT_SHARP_PATH = '/app/node_modules/sharp'
  DOCKER_BUILD    = '1'

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval   = '30s'
    timeout    = '10s'
    grace_period = '20s'
    method     = 'GET'
    path       = '/api/health'

[[vm]]
  size   = 'shared-cpu-2x'
  memory = '1gb'
